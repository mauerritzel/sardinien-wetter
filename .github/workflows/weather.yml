name: Wetter abrufen

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open-Meteo abrufen
        run: mkdir -p data && python fetch_weather.py
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "wetter-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Wetter $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
